services:
  ngnix:
    image: nginx:1.29.4-alpine3.23-perl
    ports:
      - "8080:80"
    volumes:
      - "./ngnix.conf:/etc/nginx/nginx.conf"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: "./api"
    deploy:
      replicas: 3
    environment:
      - REPLICA_INDEX={{.Task.Slot}}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
