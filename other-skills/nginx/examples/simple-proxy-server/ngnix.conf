worker_processes auto;

events { 
    worker_connections 1024;
}

http {
    upstream api {
        least_conn;
        server api-1:3000;
        server api-2:3000;
        server api-3:3000;
        server api-4:3000;
    }

    server {
        listen 80;
        server_name example.com;


        location / {
            proxy_pass http://api; 
        }
     }
}