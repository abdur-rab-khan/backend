<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background: #181a1b;
        color: #f1f1f1;
        font-family: "Roboto", Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
      }
      h1 {
        text-align: center;
        margin-top: 32px;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 24px;
        padding: 40px 5vw;
        max-width: 1400px;
        margin: 0 auto;
      }
      .gallery-item {
        background: #23272a;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .gallery-item:hover {
        transform: translateY(-6px) scale(1.03);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      }
      .gallery-item img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        display: block;
        border-bottom: 2px solid #282c34;
      }
    </style>
  </head>
  <body>
    <h1>Image Gallery</h1>
    <div class="gallery">
      <a class="gallery-item" href="page-1.html?img=1.jpg"
        ><img src="../images/1.jpg" alt="1.jpg"
      /></a>
      <a class="gallery-item" href="page-1.html?img=2.jpg"
        ><img src="../images/2.jpg" alt="2.jpg"
      /></a>
      <a class="gallery-item" href="page-1.html?img=3.jpg"
        ><img src="../images/3.jpg" alt="3.jpg"
      /></a>
      <a class="gallery-item" href="page-1.html?img=4.jpg"
        ><img src="../images/4.jpg" alt="4.jpg"
      /></a>
      <a class="gallery-item" href="page-1.html?img=5.jpg"
        ><img src="../images/5.jpg" alt="5.jpg"
      /></a>
      <a class="gallery-item" href="page-1.html?img=6.jpg"
        ><img src="../images/6.jpg" alt="6.jpg"
      /></a>
      <a class="gallery-item" href="page-1.html?img=7.jpg"
        ><img src="../images/7.jpg" alt="7.jpg"
      /></a>
      <a class="gallery-item" href="page-1.html?img=8.jpg"

      /></a>
      <a class="gallery-item" href="page-1.html?img=9.jpg"

      <a class="gallery-item" href="page-1.html?img=14.jpg"

  </body>
</html>
