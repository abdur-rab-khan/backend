name: load-balancer

services:
  nginx:
    image: nginx:1.29.4-alpine3.23-perl
    ports:
      - "8080:80"
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf"
    depends_on:
      first-api:
        condition: service_healthy
      second-api:
        condition: service_healthy
      auth:
        condition: service_healthy

  first-api:
    build:
      context: ./api_1
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  second-api:
    build:
      context: ./api_2
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  auth:
    build:
      context: ./auth
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
