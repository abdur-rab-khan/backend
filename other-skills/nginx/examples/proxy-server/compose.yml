name: proxy-server

services:
  nginx:
    image: nginx:1.29.4-alpine3.23-perl
    ports:
      - "8080:80"
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf"
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy

  api-1:
    build:
      context: ./api_1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-2:
    build:
      context: ./api_2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
