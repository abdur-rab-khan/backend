worker_processes auto;


events {
    worker_connections 1024;
}


http {
    server {
        listen 80;
        server_name _;

        location /api-1/ {
            proxy_pass http://proxy-server-api-1-1:3000/;
        }

        location /api-2/ {
            proxy_pass http://proxy-server-api-2-1:3000/;
        }
    }
}